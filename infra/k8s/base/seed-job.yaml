---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin
  namespace: kumbi
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U $POSTGRES_USER; do echo "waiting for
              postgres..."; sleep 2; done
          envFrom:
            - secretRef:
                name: postgres-secret
      containers:
        - name: seed
          image: kumbi/backend:latest
          command:
            - /app/seed
            - admin
            - $(SEED_ADMIN_EMAIL)
            - $(SEED_ADMIN_PASSWORD)
          envFrom:
            - secretRef:
                name: backend-secret
            - secretRef:
                name: postgres-secret
