---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kumbi
data:
  PORT: '8080'
  ENV: production
  STORAGE_PATH: /app/storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-pvc
  namespace: kumbi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path-retain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kumbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: backend
          image: kumbi/backend:latest
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage-pvc
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage-pvc
          persistentVolumeClaim:
            claimName: storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kumbi
spec:
  selector:
    app: backend
  ports:
    - port: 8080
