---
# Ingress for Kumbi — default k3s stack (Traefik + flannel + servicelb).
# Traefik is the default IngressController shipped with k3s (kube-system/traefik,
# Service type LoadBalancer via klipper-lb/servicelb). It binds 80/443 on the node
# and routes based on host + path. No Gateway API or Cilium required.
#
# Hostnames use ${DOMAIN} placeholder — substituted at apply time via
# `make deploy` (DOMAIN from kumbi-app-config + envsubst). Base has valid
# defaults (kumbi.test) so `kubectl kustomize` without envsubst still validates.
#
# TLS: secret `kumbi-tls` in the app namespace (mkcert for dev/test, externally
# managed for staging/prod). Traefik terminates TLS using that secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumbi
  namespace: kumbi
  annotations:
    # Explicitly handled by Traefik; keep router on both entrypoints.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "${DOMAIN}"
        - "api.${DOMAIN}"
        - "www.${DOMAIN}"
      secretName: kumbi-tls
  rules:
    - host: "${DOMAIN}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /app/storage
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: "api.${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
    - host: "www.${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
