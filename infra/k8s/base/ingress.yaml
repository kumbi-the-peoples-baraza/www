---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumbi
  namespace: kumbi
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"   # kept for nginx compat
    traefik.ingress.kubernetes.io/router.entrypoints: web # traefik compat
spec:
  ingressClassName: traefik   # k3d default; override to "nginx" for prod if needed
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
