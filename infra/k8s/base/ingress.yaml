---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumbi
  namespace: kumbi
spec:
  ingressClassName: traefik  # dev/test only — prod overlay uses nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
