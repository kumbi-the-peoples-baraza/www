---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kumbi-PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
      initContainers:
        - name: fix-permissions
          image: busybox
          command: [sh, -c, chown -R 70:70 /var/lib/postgresql/data]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U $POSTGRES_USER]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kumbi-PLACEHOLDER
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: kumbi-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kumbi-PLACEHOLDER
spec:
  selector:
    matchLabels:
      app: postgres
  ports:
    - port: 5432
