---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: kumbi
data:
  POSTGRES_DB: kumbi
  POSTGRES_USER: kumbi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
# apiVersion: v1
# kind: PersistentVolume
# metadata:
#   name: postgres-pv
#   labels:
#     type: local
#     app: postgres
# spec:
#   capacity:
#     storage: 2Gi
#   accessModes: [ReadWriteOnce]
#   hostPath:
#     path: /var/lib/postgres
#   persistentVolumeReclaimPolicy: Retain
#   storageClassName: manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kumbi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path-retain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kumbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
      initContainers:
        - name: fix-permissions
          image: busybox
          command: [sh, -c, chown -R 70:70 /var/lib/postgresql/data]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, kumbi]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kumbi
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
