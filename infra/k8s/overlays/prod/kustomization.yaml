---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kumbi
resources: [../../base, secrets.yaml]
images:
  - name: kumbi/backend
    newName: kumbi/backend
    newTag: prod
  - name: kumbi/frontend
    newName: kumbi/frontend
    newTag: prod
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Job
      name: seed-admin
