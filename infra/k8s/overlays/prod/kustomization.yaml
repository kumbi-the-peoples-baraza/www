apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingress.yaml
- secrets.yaml

# Images are built directly on the VPS and sideloaded into k3d via
# docker save | ctr images import. No external registry required.
images:
- name: kumbi/backend
  newTag: prod
- name: kumbi/frontend
  newTag: prod

replicas:
- count: 3
  name: backend
- count: 3
  name: frontend

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Job
      name: seed-admin
