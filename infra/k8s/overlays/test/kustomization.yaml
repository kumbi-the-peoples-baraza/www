---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kumbi-test
resources: [../../base, secrets.yaml]
images:
  - name: kumbi/backend
    newName: kumbi/backend
    newTag: test
  - name: kumbi/frontend
    newName: kumbi/frontend
    newTag: test
patches:
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: kumbi-test
      - op: replace
        path: /metadata/name
        value: kumbi-test
    target:
      kind: Namespace
      name: kumbi
  - patch: |-
      - op: replace
        path: /data/ENV
        value: test
    target:
      kind: ConfigMap
      name: backend-config
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Job
      name: seed-admin
