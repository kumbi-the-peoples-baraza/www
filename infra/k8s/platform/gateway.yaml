---
# Shared Gateway for all applications — deploy ONCE in platform namespace.
# Binds hostPort 80/443, terminates TLS, allows HTTPRoutes from all namespaces.
# Usage: kubectl apply -f infra/platform/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: cilium-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostPort: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostPort: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls   # Replace with your wildcard cert secret name
      allowedRoutes:
        namespaces:
          from: All
