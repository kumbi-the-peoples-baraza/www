---
# DEPRECATED — Cilium Gateway API
# This stack has been reverted to default k3s: flannel (CNI) + servicelb
# (klipper-lb) + Traefik ingress. Traefik is bundled with k3s in kube-system
# (Service type LoadBalancer via servicelb) and handles Ingress resources with
# ingressClassName: traefik (see infra/k8s/base/ingress.yaml).
#
# No shared Gateway is needed. This file is kept only as a reference for the
# previous Cilium-based setup.
#
# Previous spec (for history):
#   kind: Gateway
#   metadata: {name: cluster-gateway, namespace: cilium-gateway}
#   spec: {gatewayClassName: cilium, listeners: [http:80 hostPort:80, https:443 ...]}
#
# Default k3s equivalent (informational):
#   - CNI:            flannel (kube-system, DaemonSet)
#   - LoadBalancer:   servicelb / klipper-lb (kube-system, svclb-traefik)
#   - Ingress:        Traefik (kube-system/traefik, IngressClass traefik)
#   No action required — `make deploy` verifies Traefik via `make _ensure-ingress`.
