# Kumbi host-level reverse proxy (optional — rarely needed with default k3s).
# Rendered by `make _ensure-hostroute` when a host nginx is running.
# Default k3s uses Traefik in kube-system as a LoadBalancer Service via
# servicelb (klipper-lb) which already binds 80/443 on the node and handles
# TLS termination using the kumbi-tls secret (Ingress.spec.tls). This file
# is only needed if you run an additional host nginx in front of Traefik and
# want it to forward 80/443 → the Traefik-published ports.
#
# Current default: INGRESS_HTTP_PORT / INGRESS_HTTPS_PORT are 80 / 443
# (published by Traefik's LoadBalancer Service). The optional host nginx
# would be redundant in that case; the stream below becomes a 1:1 passthrough.
# If you keep non-standard ports (e.g. 12080/12443), adjust kumbi-app-config
# and this file will forward 80→12080 and 443→12443.
#
# Rendered with envsubst from: INGRESS_HTTP_PORT, INGRESS_HTTPS_PORT
# Then installed via: envsubst < infra/host/nginx-stream.conf > /etc/nginx/conf.d/kumbi.conf
# And reloaded: nginx -t && systemctl reload nginx  (or nginx -s reload)
#
# Note: with default k3s + servicelb + Traefik, you generally DO NOT need
# this file — Traefik already handles hostPort 80/443. Keep it only for
# custom front-door setups.

# ── HTTPS stream passthrough ──────────────────────────────────────────────
# TCP passthrough to Traefik's HTTPS port so the cluster handles TLS
# termination with the kumbi-tls secret (Ingress.spec.tls).
stream {
  server {
    listen 443;
    ssl_preread on;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_PORT};
    proxy_connect_timeout 3s;
    proxy_timeout 10m;
  }
  server {
    listen 443 udp;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_PORT};
    proxy_timeout 10m;
  }
}

# ── HTTP reverse proxy ────────────────────────────────────────────────────
# Proxies port 80 to Traefik's HTTP port. Traefik issues the redirect to HTTPS
# if the Ingress has the appropriate middleware/annotation.
http {
  server {
    listen 80 default_server;
    server_name _;
    location / {
      proxy_pass http://127.0.0.1:${INGRESS_HTTP_PORT};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
