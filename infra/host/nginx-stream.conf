# Kumbi host-level reverse proxy (optional).
# Rendered by `make _ensure-hostroute` (and `make deploy`) when a host nginx is
# running. Forwards 80/443 to the F5 NGINX Ingress Controller, which binds the
# host ingress ports directly (hostNetwork): INGRESS_HTTP_PORT / INGRESS_HTTPS_PORT
# (default 12080 / 12443). The IC already terminates TLS using the kumbi-tls
# secret, so this is purely a port publish from 80/443 → those ports.
#
# Rendered with envsubst from: INGRESS_HTTP_PORT, INGRESS_HTTPS_PORT
# Then installed via:  sudo envsubst < infra/host/nginx-stream.conf | sudo tee /etc/nginx/conf.d/kumbi-stream.conf
# And reloaded: sudo nginx -t && sudo systemctl reload nginx

# ── HTTPS stream passthrough ──────────────────────────────────────────────
# TCP passthrough to the F5 NGINX IC host port so the cluster handles TLS
# termination with the kumbi-tls secret.
stream {
  server {
    listen 443;
    ssl_preread on;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_PORT};
    proxy_connect_timeout 3s;
    proxy_timeout 10m;
  }
  server {
    listen 443 udp;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_PORT};
    proxy_timeout 10m;
  }
}

# ── HTTP reverse proxy ────────────────────────────────────────────────────
# Proxies port 80 to the F5 NGINX IC host port. The IC issues the 308
# redirect to HTTPS based on the ingress annotation.
http {
  server {
    listen 80 default_server;
    server_name _;
    location / {
      proxy_pass http://127.0.0.1:${INGRESS_HTTP_PORT};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
