# Kumbi host-level reverse proxy.
# Rendered by `make tls` (and `make deploy`) when the host runs nginx as the
# public ingress. Forwards 80/443 TCP to the k3s ingress-nginx NodePorts so
# k8s terminates TLS using the in-cluster certificate (mkcert / cert-manager).
#
# Rendered with envsubst from: INGRESS_HTTP_NODEPORT, INGRESS_HTTPS_NODEPORT
# Then installed via:  sudo envsubst < infra/host/nginx-stream.conf | sudo tee /etc/nginx/conf.d/kumbi-stream.conf
# And reloaded: sudo nginx -t && sudo systemctl reload nginx

# ── HTTPS stream passthrough ──────────────────────────────────────────────
# TCP passthrough to ingress-nginx NodePort so the cluster handles TLS
# termination with the kumbi-tls secret.
stream {
  server {
    listen 443;
    ssl_preread on;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_NODEPORT};
    proxy_connect_timeout 3s;
    proxy_timeout 10m;
  }
  server {
    listen 443 udp;
    proxy_pass 127.0.0.1:${INGRESS_HTTPS_NODEPORT};
    proxy_timeout 10m;
  }
}

# ── HTTP reverse proxy ────────────────────────────────────────────────────
# Proxies port 80 to ingress-nginx NodePort. ingress-nginx issues the 308
# redirect to HTTPS based on the ingress annotations.
http {
  server {
    listen 80 default_server;
    server_name _;
    location / {
      proxy_pass http://127.0.0.1:${INGRESS_HTTP_NODEPORT};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
