name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jimbi_test
          POSTGRES_USER: jimbi
          POSTGRES_PASSWORD: jimbi_secret
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgres://jimbi:jimbi_secret@localhost:5432/jimbi_test?sslmode=disable
          JWT_SECRET: test_secret_at_least_32_chars_long
        run: go test ./... -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install & Build
        working-directory: frontend
        run: |
          bun install
          bun run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Docker Compose
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOW_ORIGIN: ${{ secrets.ALLOW_ORIGIN }}
        run: |
          echo "Add SSH deploy or k8s rollout here"
