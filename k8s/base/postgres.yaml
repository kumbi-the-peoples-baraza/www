---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: kumbi
data:
  POSTGRES_DB: kumbi
  POSTGRES_USER: kumbi
---
# postgres-secret (POSTGRES_PASSWORD) is applied from k8s/prod/secrets.yaml
# Do NOT define it here — it would overwrite the value from secrets.yaml.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kumbi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kumbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, kumbi]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kumbi
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
