---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin
  namespace: kumbi
  annotations:
    # Re-run by deleting the job: kubectl delete job seed-admin -n kumbi
    description: "Seeds the default admin@kumbi.local account. Idempotent."
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U kumbi; do
                echo "waiting for postgres..."; sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: seed
          image: localhost:32000/kumbi/backend:latest
          command:
            - /app/seed
            - admin
            - $(SEED_ADMIN_EMAIL)
            - $(SEED_ADMIN_PASSWORD)
          envFrom:
            - secretRef:
                name: backend-secret
