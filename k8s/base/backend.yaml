apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kumbi
data:
  PORT: "8080"
  ENV: production
  STORAGE_PATH: /app/storage
---
# backend-secret is applied from k8s/prod/secrets.yaml (prod) or k8s/dev/pod.sh (dev)
# It must contain: DATABASE_URL, JWT_SECRET, ALLOW_ORIGIN
# Optional: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, WHATSAPP_WEBHOOK_URL
# Seed: SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-pvc
  namespace: kumbi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kumbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:32000/kumbi/backend:latest
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kumbi
spec:
  selector:
    app: backend
  ports:
    - port: 8080
