server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — aggressive, cacheable
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff font/woff2 application/font-woff application/vnd.ms-fontobject;

    # Never cache index.html (SPA entry) — ensures deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA routing — no-cache for HTML, fallback to index
    location / {
        try_files $uri $uri/ /index.html;
        # HTML navigations should not be cached
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }
    }

    # Proxy API to backend — no cache
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not cache API responses at CDN level by default
        add_header Cache-Control "no-store" always;
        expires -1;
    }

    # Static storage — user uploads, cache 7d but revalidate (not immutable)
    location ^~ /app/storage/ {
        root /;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
        open_file_cache max=1000 inactive=20s;
        open_file_cache_valid 30s;
    }

    # Cache hashed static assets — immutable 1y
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000, stale-while-revalidate=86400" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
        # Allow CORS for fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*" always;
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
        }
    }
}
